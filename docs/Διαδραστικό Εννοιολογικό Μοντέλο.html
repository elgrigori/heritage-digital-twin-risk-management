<style>

  #bar h1{font-size:16px;margin:0 14px 0 0;font-weight:700;letter-spacing:.2px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:hover{background:#f3efe6}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#9f4918}
  #step{font-size:13px;color:var(--muted);min-width:92px;text-align:center;font-weight:600}
  .legend{display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .lg{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#4a5568}
  .sw{width:20px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
  #stage{position:absolute;inset:64px 0 0 0;overflow:hidden;cursor:grab;background:radial-gradient(1200px 700px at 60% 35%,#fbf9f3,#efe9dc)}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .sec rect{fill:#ffffff;opacity:.55;stroke:#e4ddcc}
  .sec text{fill:#9a8f76;font-weight:700;letter-spacing:1px;font-size:20px}
  .sub rect{fill:#efe9dc;stroke:#e0d8c6}
  .sub text{fill:#7a6f58;font-weight:700;font-size:16px;letter-spacing:.5px}
  .edge path{fill:none;stroke:#b9ad95;stroke-width:2}
  .edge.sub path{stroke-dasharray:6 6;stroke:#c7bca4}
  .edge .elab{fill:#6e6450;font-size:13px}
  .edge .elab-bg{fill:#f6f3ec;opacity:.9}
  .node rect{stroke-width:2;rx:10}
  .node text{font-size:15px;fill:#1e2a38;font-weight:600}
  .node .tag{font-size:11.5px;font-weight:700;letter-spacing:.3px}
  .node{cursor:pointer}
  .std-crm rect{fill:var(--crm);stroke:var(--crmS)} .std-crm .tag{fill:var(--crmS)}
  .std-crmdig rect{fill:var(--crmdig);stroke:var(--crmdigS)} .std-crmdig .tag{fill:var(--crmdigS)}
  .std-rhdto rect{fill:var(--rhdto);stroke:var(--rhdtoS)} .std-rhdto .tag{fill:var(--rhdtoS)}
  .std-proposed rect{fill:var(--prop);stroke:var(--propS)} .std-proposed .tag{fill:#b07d12}
  /* states */
  svg.focusing .node:not(.hl){opacity:.16}
  svg.focusing .edge:not(.hl){opacity:.05}
  svg.focusing .sec,svg.focusing .sub{opacity:.5}
  .node.hl rect{stroke-width:5;filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
  .node.hl text{font-weight:800}
  .node.near rect{stroke-width:3.5}
  .edge.hl path{stroke:var(--accent);stroke-width:4;stroke-dasharray:none}
  .edge.hl .elab{fill:var(--accent);font-weight:800;font-size:15px}
  .edge.hl .elab-bg{fill:#fff;opacity:1}
  #cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(720px,92vw);background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:16px 20px;display:none;z-index:6}
  #cap.on{display:block}
  #cap b{color:var(--accent)}
  #cap .t{font-size:19px;font-weight:800;margin-bottom:4px}
  #cap .d{font-size:15px;color:#4a5568;line-height:1.45}
  #zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:6}
  #zoom .btn{width:42px;height:42px;font-size:20px;padding:0;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  #hint{position:absolute;left:16px;bottom:16px;font-size:12.5px;color:#8a7f66;z-index:6;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:8px}
</style>

// split "Code Rest" -> tag + name  (e.g. "E13 Attribute Assignment", "HC22 Digital Operation")
function splitTag(label){
  const m=label.match(/^((?:HC|HP|E|P|D|L|S|O)\d+\w*)\s+(.*)$/);
  if(m)return[m[1],m[2]]; return[null,label];
}

// defs: arrow markers
const defs=el('defs',{},vp);
defs.innerHTML=`<marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9ad95"/></marker>
<marker id="arrhl" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5541e"/></marker>
<marker id="arrsub" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c7bca4"/></marker>`;

// sections
const gSec=el('g',{},vp);
DATA.sections.forEach(s=>{
  const g=el('g',{class:'sec'},gSec);
  el('rect',{x:s.x+OX,y:s.y+OY,width:s.w,height:s.h,rx:18},g);
  if(s.label){const t=el('text',{x:s.x+OX+22,y:s.y+OY+34},g); t.textContent=s.label;}
});
DATA.subheaders.forEach(s=>{
  const g=el('g',{class:'sub'},gSec);
  el('rect',{x:s.x+OX,y:s.y+OY,width:s.w,height:s.h,rx:8},g);

// edges
const gEdge=el('g',{},vp); const edgeEls=[];
DATA.edges.forEach((e,i)=>{
  const a=byId[e.s], b=byId[e.t]; if(!a||!b)return;
  const isSub=!e.label;
  const g=el('g',{class:'edge'+(isSub?' sub':''),'data-i':i},gEdge);
  {const _ti=el('title',{},g);_ti.textContent=titleFor(e);}
  const [ax,ay]=clip(a, cx(b),cy(b)); const [bx,by]=clip(b, cx(a),cy(a));
  const p=el('path',{d:`M${ax},${ay} L${bx},${by}`,'marker-end':isSub?'url(#arrsub)':'url(#arr)'},g);
  if(e.label){
    const mx=(ax+bx)/2, my=(ay+by)/2;
    const bg=el('rect',{class:'elab-bg',x:mx-e.label.length*3.6-4,y:my-11,width:e.label.length*7.2+8,height:20,rx:5},g);
    const t=el('text',{class:'elab',x:mx,y:my+4,'text-anchor':'middle'},g); t.textContent=e.label;
  }
  g._e=e; edgeEls.push(g);
});
// nodes
const gNode=el('g',{},vp); const nodeEls={};
DATA.nodes.forEach(n=>{
  const g=el('g',{class:'node std-'+n.std,'data-id':n.id},gNode);
  el('rect',{x:n.x+OX,y:n.y+OY,width:n.w,height:n.h,rx:10},g);
  const [tag,name]=splitTag(n.label);
  const lines=wrap(name,22);
  const total=(tag?1:0)+lines.length;
  let yy=n.y+OY+n.h/2 - (total-1)*10 + 4;
  if(tag){const t=el('text',{class:'tag',x:cx(n),y:yy,'text-anchor':'middle'},g);t.textContent=tag;yy+=20;}
  lines.forEach(ln=>{const t=el('text',{x:cx(n),y:yy,'text-anchor':'middle'},g);t.textContent=ln;yy+=19;});
  g.addEventListener('click',(ev)=>{ev.stopPropagation(); focus(n.id,true);});
  nodeEls[n.id]=g;
});

// --- focus / highlight ---
function clearHL(){
  svg.classList.remove('focusing');
  Object.values(nodeEls).forEach(g=>g.classList.remove('hl','near'));
  edgeEls.forEach(g=>g.classList.remove('hl'));
}
function focus(id, center){
  clearHL(); svg.classList.add('focusing');
  nodeEls[id].classList.add('hl');
  inc[id].forEach(e=>{ edgeEls[e._i].classList.add('hl'); const other=e.s===id?e.t:e.s; if(nodeEls[other])nodeEls[other].classList.add('near'); });
  if(center) centerOn(byId[id]);
}
stage.addEventListener('click',()=>{clearHL(); cap.classList.remove('on'); tourIdx=-1; updStep();});

// --- pan / zoom ---
let T={x:0,y:0,k:1};
function apply(){vp.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`);}
function svgSize(){return {w:stage.clientWidth,h:stage.clientHeight};}
function fit(){
  const s=svgSize(); const sc=Math.min(s.w/VB.w,s.h/VB.h)*0.98;
  T.k=sc; T.x=(s.w-VB.w*sc)/2; T.y=(s.h-VB.h*sc)/2; apply();
}
function centerOn(n){
  const s=svgSize(); const k=Math.min(1.15, Math.max(0.5, s.h/ (n.h*6)));
  T.k=k; T.x=s.w/2 - (cx(n))*k; T.y=s.h*0.46 - (cy(n))*k; apply();
}
// svg uses viewBox; but we also scale via transform in user units. Convert: our transform is in viewBox units? 
// Simpler: svg has viewBox 0..VB; set width/height = client. transform translate/scale in viewBox coords mapped by viewBox. We'll instead map client->viewBox.
function applyVB(){ // recompute viewBox to emulate pan/zoom
  const s=svgSize(); const vw=s.w/T.k, vh=s.h/T.k;
  svg.setAttribute('viewBox',`${-T.x/T.k} ${-T.y/T.k} ${vw} ${vh}`);
}
// override apply to use viewBox approach for crisp scaling
apply=function(){applyVB();};
vp.removeAttribute('transform');

let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;T.x=drag.tx+(e.clientX-drag.x);T.y=drag.ty+(e.clientY-drag.y);apply();});
stage.addEventListener('pointerup',e=>{drag=null;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;const s=svgSize();const mx=e.clientX-stage.getBoundingClientRect().left,my=e.clientY-stage.getBoundingClientRect().top;
  const bx=(mx-T.x)/T.k,by=(my-T.y)/T.k; T.k=Math.max(0.2,Math.min(3,T.k*f)); T.x=mx-bx*T.k; T.y=my-by*T.k; apply();},{passive:false});
document.getElementById('zin').onclick=()=>{T.k=Math.min(3,T.k*1.2);apply();};
document.getElementById('zout').onclick=()=>{T.k=Math.max(0.2,T.k/1.2);apply();};
document.getElementById('zfit').onclick=()=>{clearHL();cap.classList.remove('on');tourIdx=-1;updStep();fit();};

// --- guided tour ---
const TOUR=[
 ["HC3 Tangible","Το μνημείο","Το φυσικό αγαθό που προστατεύουμε — <b>HC3 Tangible Entity</b> (≡ E22). Όλα καταλήγουν εδώ: η αξιολόγηση το αφορά (<b>P140</b> «αποδίδει ιδιότητα σε») και η ενέργεια το αλλάζει (<b>P31</b> «τροποποίησε»)."],
 ["HC2 Heritage","Το Ψηφιακό Δίδυμο","<b>HC2 Heritage Digital Twin</b>: η ζωντανή ψηφιακή αναπαράσταση του μνημείου. Συνδέεται με το αγαθό μέσω <b>HP1</b> («έχει ψηφιακό δίδυμο»)."],
 ["Incoming Monitoring","Εισερχόμενα δεδομένα","<b>Incoming Monitoring Data</b> — υποκλάση του D9 Data Object (CRMdig). Είναι η είσοδος της επεξεργασίας: <b>L10 had input</b> = «η διεργασία πήρε ως είσοδο αυτά τα δεδομένα»."],
 ["Data Processing","Επεξεργασία","<b>Data Processing</b> (HC22, ψηφιακή λειτουργία): επεξεργάζεται τα ακατέργαστα δεδομένα. Με <b>L11 had output</b> («είχε ως έξοδο») παράγει τους επεξεργασμένους δείκτες."],
 ["Risk Evaluation","Αξιολόγηση κινδύνου","<b>Risk Evaluation</b> (HC22): υπολογίζει τον κίνδυνο. Με <b>P16 used specific object</b> («χρησιμοποίησε συγκεκριμένο αντικείμενο») αξιοποιεί τις παραμέτρους (HC23) και τις διαστάσεις (E54)."],
 ["Risk Assessment","Σημασιολογική απόδοση","<b>Risk Assessment</b> (E13, «πράξη απόδοσης»): δίνει νόημα στα δεδομένα. <b>P140</b> = σε ποιο αγαθό αφορά· <b>P141</b> («αποδίδει») = ποια κατάσταση κινδύνου· <b>P15</b> («επηρεάστηκε από») = η αξιολόγηση που την τροφοδότησε."],
 ["Risk State","Κατάσταση κινδύνου","<b>Risk State</b> (E3, «κατάσταση σε μια περίοδο»). Το επίπεδο κινδύνου δηλώνεται με <b>P2 has type</b> («έχει τύπο»), π.χ. ΥΨΗΛΗ ή ΚΡΙΣΙΜΗ."],
 ["Alerting Activity","Ειδοποίηση","<b>Alerting Activity</b> (E7, δραστηριότητα). <b>P9 consists of</b> («αποτελείται από») τη συνδέει με το Συμβάν Ενεργοποίησης, και <b>P134i</b> («συνεχίστηκε από») δίνει τη χρονική σειρά των βημάτων."],
 ["HC14 Activation","Συμβάν ενεργοποίησης","<b>HC14 Activation Event</b>: ενεργοποιεί τους μηχανισμούς. <b>HP15</b> («ενεργοποίησε») θέτει σε λειτουργία τον Actuator (HC11)· <b>HP16</b> («ειδοποίησε») ενημερώνει την ομάδα (E74)."],
 ["Risk Management Activity","Διαχείριση κινδύνου","<b>Risk Management Activity</b> (E7). <b>P14 carried out by</b> («εκτελέστηκε από») την αρμόδια ομάδα· <b>P9</b> («αποτελείται από») τη συγκεκριμένη ενέργεια· <b>P15</b> («επηρεάστηκε από») την κατάσταση βλάβης."],
 ["Management Action","Διαχειριστική ενέργεια","<b>Management Action</b>: η απόφαση / μετριασμός / επιθεώρηση. Ο τύπος της δηλώνεται με <b>P2 has type</b>· με <b>P16</b> («χρησιμοποίησε συγκεκριμένο αντικείμενο») αφορά το ίδιο το δίδυμο."],
 ["Digital Twin Update","Ενημέρωση διδύμου","<b>Digital Twin Update Operation</b> (HC22): ενημερώνει το δίδυμο. <b>HP27</b> («αφορά το αγαθό») και <b>HP28</b> («υλοποιείται μέσω» υπηρεσίας)· παράγει νέα δεδομένα κατάστασης (D9)."],
 ["Hazard Scenario","Σενάριο κινδύνου","<b>Hazard Scenario</b> (E89, «προτασιακό αντικείμενο»): περιγράφει έναν πιθανό κίνδυνο. Παίρνει τύπο με <b>P2 has type</b> και αφορά το συγκεκριμένο αγαθό."],
 ["Anthropogenic Hazard","Ανθρωπογενής δράση","<b>Anthropogenic Hazard Activity</b> (E7). <b>P14</b> («εκτελέστηκε από») τον δράστη (E39)· <b>P9</b> μια τροποποίηση (E11) που με <b>P31</b> («τροποποίησε») επεμβαίνει στο αγαθό· <b>P15i</b> («επηρέασε») την αξιολόγηση."],
 ["E14 Condition","Αξιολόγηση κατάστασης","<b>E14 Condition Assessment</b>: διαπιστώνει τη βλάβη. <b>P34 concerned</b> («αφορούσε») το αγαθό και <b>P35 has identified</b> («αναγνώρισε») την κατάσταση βλάβης."],
 ["Damage State","Κατάσταση βλάβης","<b>Damage State</b> (E3): η πραγματική φθορά που έχει ήδη συμβεί — διαφορετική από τον «κίνδυνο», που είναι πρόβλεψη. Ο τύπος της δηλώνεται με <b>P2 has type</b>."],
];
let tourIdx=-1; const cap=document.getElementById('cap');
function updStep(){document.getElementById('step').textContent = tourIdx>=0? `Βήμα ${tourIdx+1} / ${TOUR.length}`:'';
  document.getElementById('next').textContent = tourIdx<0?'Εκκίνηση ▶':(tourIdx>=TOUR.length-1?'Τέλος ✓':'Επόμενο ▶');}
function showStep(){
  const [lab,title,desc]=TOUR[tourIdx]; const n=findByLabel(lab); if(!n)return;
  focus(n.id,true); cap.classList.add('on'); cap.querySelector('.t').textContent=title; cap.querySelector('.d').innerHTML=desc; updStep();
}
document.getElementById('next').onclick=()=>{ if(tourIdx<TOUR.length-1){tourIdx++;showStep();} };
document.getElementById('prev').onclick=()=>{ if(tourIdx>0){tourIdx--;showStep();} };
document.getElementById('reset').onclick=()=>{clearHL();cap.classList.remove('on');tourIdx=-1;updStep();fit();};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='Escape')document.getElementById('reset').click();});
addEventListener('resize',apply);
fit(); updStep();
</script>
